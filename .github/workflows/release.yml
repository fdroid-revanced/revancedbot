name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      new_version:
        description: 'New tag version'
        type: choice
        default: 'next'
        options:
          - next
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup git config
        run: |
          git config user.name actions-bot
          git config user.email actions-bot@users.noreply.github.com

      - uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8 # v3

      - name: Validate GoReleaser config
        run: goreleaser check

      # Dispatch mints the tag; the tag run publishes. Avoids a second goreleaser
      # after GitHub materializes the tag from a Release.
      - name: Tag for dispatch
        if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
        env:
          NEW_VERSION: ${{ github.event.inputs.new_version }}
        run: |
          set -euo pipefail
          TAG="$(svu "${NEW_VERSION:-next}")"
          echo "Releasing tag: $TAG (svu current=$(svu current 2>/dev/null || echo none))"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists" >&2
            exit 1
          fi
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
          echo "Pushed $TAG; the tag workflow publishes the GitHub Release." >> "$GITHUB_STEP_SUMMARY"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean
